services:
  mariadb:
    image: mariadb:11
    container_name: dashboard-mariadb
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - dashboard_mariadb_data:/var/lib/mysql

volumes:
  dashboard_mariadb_data:
    external: true
